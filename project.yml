name: MacFanControl
options:
  bundleIdPrefix: com.eond
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  MacFanControl:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Resources/Info.plist"
    resources:
      - App/Resources/Assets.xcassets
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleName: MacFanControl
        CFBundleDisplayName: "맥북 팬 관리"
        CFBundleIdentifier: com.eond.macfancontrol
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 eond.com"
        NSAppleEventsUsageDescription: "전원 모드 변경에 관리자 권한이 필요합니다."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eond.macfancontrol
        PRODUCT_NAME: MacFanControl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: NO
