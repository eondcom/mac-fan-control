name: MacFanControl
options:
  bundleIdPrefix: com.eond
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: ko

settings:
  base:
    MARKETING_VERSION: "2.2.1"
    CURRENT_PROJECT_VERSION: "7"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  MacFanControl:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Resources/Info.plist"
    resources:
      - App/Resources/Assets.xcassets
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleName: MacFanControl
        CFBundleDisplayName: MacFanControl
        LSHasLocalizedDisplayName: true
        CFBundleIdentifier: com.eond.macfancontrol
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 eond.com"
        NSAppleEventsUsageDescription: "전원 모드 변경에 관리자 권한이 필요합니다."
    dependencies:
      - sdk: ServiceManagement.framework
      - target: MacFanSMC
        embed: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eond.macfancontrol
        PRODUCT_NAME: MacFanControl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: NO

  # 팬 쓰기 전용 root 헬퍼 — 앱이 /Library/PrivilegedHelperTools에 setuid로 설치한다.
  MacFanSMC:
    type: tool
    platform: macOS
    sources:
      - Helper
      - App/SMC
    dependencies:
      - sdk: IOKit.framework
    settings:
      base:
        PRODUCT_NAME: macfan-smc
        PRODUCT_BUNDLE_IDENTIFIER: com.eond.macfancontrol.smc
        SKIP_INSTALL: YES
