name: Build macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, unsigned)
        run: |
          xcodebuild \
            -project MacFanControl.xcodeproj \
            -scheme MacFanControl \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check universal binary
        run: |
          for f in build/Build/Products/Release/MacFanControl.app/Contents/MacOS/*; do
            [ -f "$f" ] || continue
            lipo "$f" -verify_arch arm64 x86_64 || { echo "::error::$f is not universal"; exit 1; }
          done

      - name: Create DMG
        run: |
          mkdir -p dist
          cp -R build/Build/Products/Release/MacFanControl.app dist/
          hdiutil create \
            -volname "MacFanControl" \
            -srcfolder dist/MacFanControl.app \
            -ov -format UDZO \
            dist/MacFanControl.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacFanControl
          path: dist/MacFanControl.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: MacFanControl

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MacFanControl.dmg
          body: |
            ## MacFanControl ${{ github.ref_name }}

            ### 설치 방법
            1. `MacFanControl.dmg` 다운로드
            2. DMG 열어서 `MacFanControl.app`을 Applications 폴더로 드래그
            3. 처음 실행 시 **우클릭 → 열기** (Gatekeeper 우회)

            ### 새 기능
            - 모니터 탭: 내장 화면 끄기·켜기, 해상도별 배율·그래픽 부하, 연결 방식, 색상 프로필 추천
            - 성능 탭: 느려진 순간 기록, 자주 원인으로 잡힌 앱, 속도 저하 진단
            - 배터리 탭: 충전 전력(W), 전원 모드
            - 화면 배율 ⌘+ / ⌘- / ⌘0, 전체 새로고침 ⌘R
            - 후원: 카카오페이 QR·PayPal (설정·메뉴바 ♥·사이드바)

            ### v2.1.2 개선
            - 앱 자체 CPU 사용 감소 — 성능 탭 열어 둠 평균 약 11% → 4%, 창 닫힘 약 2.5%
            - CPU 속도 제한·충전 상태를 외부 명령 없이 읽음
            - 성능 모니터링은 기본 꺼짐 (성능 탭에서 켤 수 있음)

            ### v2.1.3 개선
            - 업데이트 확인 결과 표시 — 확인 중 / 최신 버전입니다 / 확인 실패

            ### v2.2.0 새 기능
            - 스로틀 전 자동 절전: CPU가 켜는 온도(기본 85°C) 이상 30초 이어지면 저전력 모드로 터보를 낮추고, 끄는 온도(기본 70°C) 아래로 2분 식으면 되돌림 (팬 제어 탭)
            - 부하가 오르면 팬 미리 올리기: 온도보다 먼저 CPU 부하를 보고 팬을 올림 (구간 상한 유지)
            - CPU를 오래 쓰는 앱 우선순위 낮추기: 1분 넘게 CPU 50% 이상인 앱을 뒤로 미룸, 앞으로 가져오면 복구 (성능 탭)
            - 대시보드에 CPU·메모리 사용량과 많이 쓰는 앱 순위
            - 성능 탭은 기록을 꺼도 현재 상태가 보임 ("백그라운드 기록"으로 이름 변경)
            - 전원 모드 전환에 암호를 묻지 않음 (팬 제어 도우미 v2 — 처음 한 번 다시 설치)

            ### v2.2.0 수정
            - 내장 화면을 끄고 외장 모니터만 쓸 때 모니터 절전에서 화면이 안 돌아오던 문제
            - 비상 단축키 ⌃⌥⌘B — 화면이 안 나오면 내장 화면을 바로 켬