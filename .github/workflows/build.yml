name: Build macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build .app
        run: |
          pyinstaller \
            --windowed \
            --onefile \
            --name "MacFanControl" \
            fan-control.py

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "MacFanControl" \
            -srcfolder "dist/MacFanControl.app" \
            -ov -format UDZO \
            "dist/MacFanControl.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacFanControl
          path: dist/MacFanControl.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: MacFanControl

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MacFanControl.dmg
          body: |
            ## MacFanControl ${{ github.ref_name }}

            ### 설치 방법
            1. `MacFanControl.dmg` 다운로드
            2. DMG 열어서 `MacFanControl.app`을 Applications 폴더로 드래그
            3. 처음 실행 시 **우클릭 → 열기** (Gatekeeper 우회)

            > Intel Mac 사용자: Rosetta 2가 설치되어 있으면 그대로 실행됩니다.
            > (`softwareupdate --install-rosetta` 로 설치 가능)

            ### 팬 속도 조절 요구사항
            [smcFanControl](https://github.com/hholtmann/smcFanControl) 앱의 `smc` 바이너리가 필요합니다.
            전원 모드(절전/기본) 전환은 별도 설치 없이 동작합니다.
