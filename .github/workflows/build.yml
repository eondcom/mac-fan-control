name: Build macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, unsigned)
        run: |
          xcodebuild \
            -project MacFanControl.xcodeproj \
            -scheme MacFanControl \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create DMG
        run: |
          mkdir -p dist
          cp -R build/Build/Products/Release/MacFanControl.app dist/
          hdiutil create \
            -volname "MacFanControl" \
            -srcfolder dist/MacFanControl.app \
            -ov -format UDZO \
            dist/MacFanControl.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacFanControl
          path: dist/MacFanControl.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: MacFanControl

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MacFanControl.dmg
          body: |
            ## MacFanControl ${{ github.ref_name }}

            ### 설치 방법
            1. `MacFanControl.dmg` 다운로드
            2. DMG 열어서 `MacFanControl.app`을 Applications 폴더로 드래그
            3. 처음 실행 시 **우클릭 → 열기** (Gatekeeper 우회)

            ### 새 기능
            - 모니터 탭: 내장 화면 끄기·켜기, 해상도별 배율·그래픽 부하, 연결 방식, 색상 프로필 추천
            - 성능 탭: 느려진 순간 기록, 자주 원인으로 잡힌 앱, 속도 저하 진단
            - 배터리 탭: 충전 전력(W), 전원 모드
            - 화면 배율 ⌘+ / ⌘- / ⌘0, 전체 새로고침 ⌘R
            - 후원: 카카오페이 QR·PayPal (설정·메뉴바 ♥·사이드바)

            ### v2.1.2 개선
            - 앱 자체 CPU 사용 감소 — 성능 탭 열어 둠 평균 약 11% → 4%, 창 닫힘 약 2.5%
            - CPU 속도 제한·충전 상태를 외부 명령 없이 읽음
            - 성능 모니터링은 기본 꺼짐 (성능 탭에서 켤 수 있음)