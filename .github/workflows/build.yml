name: Build macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, unsigned)
        run: |
          xcodebuild \
            -project MacFanControl.xcodeproj \
            -scheme MacFanControl \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create DMG
        run: |
          mkdir -p dist
          cp -R build/Build/Products/Release/MacFanControl.app dist/
          hdiutil create \
            -volname "MacFanControl" \
            -srcfolder dist/MacFanControl.app \
            -ov -format UDZO \
            dist/MacFanControl.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacFanControl
          path: dist/MacFanControl.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: MacFanControl

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MacFanControl.dmg
          body: |
            ## MacFanControl ${{ github.ref_name }}

            ### 설치 방법
            1. `MacFanControl.dmg` 다운로드
            2. DMG 열어서 `MacFanControl.app`을 Applications 폴더로 드래그
            3. 처음 실행 시 **우클릭 → 열기** (Gatekeeper 우회)

            > 이 버전부터 Swift+SwiftUI로 재작성되었습니다.
            > 외부 `smc` 바이너리(smcFanControl) 의존성이 제거됐습니다.
